server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    # ---- Kompresi gzip (built-in nginx, aman di image nginx:alpine) ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ---- Brotli (OPSIONAL — butuh module tambahan) ----
    # Modul ngx_brotli TIDAK built-in di image nginx:alpine.
    # Untuk mengaktifkannya: ganti image service `webserver` di docker-compose.yml
    # dengan image yang menyertakan ngx_brotli, lalu uncomment blok di bawah.
    # brotli on;
    # brotli_comp_level 6;
    # brotli_min_length 1024;
    # brotli_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Asset hasil build Vite (public/build) — nama file ber-hash, aman cache 1 tahun + immutable
    # ^~ supaya prefix ini selalu menang atas regex location (mis. kalau ada svg/woff2 di build)
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
        access_log off;
    }

    # Asset statis lain (gambar, ikon, font)
    location ~* \.(?:jpg|jpeg|png|gif|ico|webp|svg|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}
