services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: impasin-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - impasin-network

  webserver:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8001:80"  # <--- UBAH INI (Host 8001 -> Container 80)
    volumes:
      - ./:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - impasin-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: impasin
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - impasin-network

networks:
  impasin-network:
    driver: bridge

volumes:
  dbdata:
    driver: local